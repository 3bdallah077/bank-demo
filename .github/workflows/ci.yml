name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build the jar
        run: mvn -B -DskipTests package

      - name: Start the app on the H2 profile
        run: |
          nohup java -jar target/bank-demo-1.0.0.jar --spring.profiles.active=local > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then echo "UP after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not start"; tail -50 app.log; exit 1

      - name: Health check
        run: curl -s http://localhost:8080/actuator/health

      - name: API smoke test
        run: BASE=http://localhost:8080 python3 tests/api_smoke_test.py

      - name: Postman collection (59 assertions)
        run: |
          npm install -g newman
          newman run api/postman_collection.json --env-var baseUrl=http://localhost:8080

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
