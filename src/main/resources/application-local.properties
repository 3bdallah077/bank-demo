# =====================================================================
#  "local" profile  ->  H2 file database, NO MySQL installation needed
#  Used by the Windows one-click scripts (run.bat).
#  Data file lives in ./data/bank_system.mv.db
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/bank_system;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The schema ships with the project (db/h2/bank_system_h2.sql) and is created once.
# "continue-on-error" keeps it re-runnable on every start without touching existing data.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/bank_system_h2.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Validation is disabled here on purpose: the H2 file mirrors the MySQL schema but not
# byte-for-byte. The MySQL path (default profile) still validates strictly.
spring.jpa.hibernate.ddl-auto=none
