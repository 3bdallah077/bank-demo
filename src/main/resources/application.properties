# Database: override with environment variables. No real secrets are stored in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Existing schema is used as-is. Never let Hibernate change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

server.port=${PORT:8080}
# NFR-04: session expires after 10 minutes of inactivity
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Business settings
bank.fraud.threshold=${FRAUD_THRESHOLD:1000.00}
bank.login.max-failed-attempts=3
bank.login.lock-minutes=${LOCK_MINUTES:15}
# Teaching switch (Test failure injection for NFR-05). When true every transfer throws after the debit step.
bank.testing.fail-transfer-after-debit=${FAIL_TRANSFER_AFTER_DEBIT:false}
