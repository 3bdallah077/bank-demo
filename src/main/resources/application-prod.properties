# =====================================================================
#  "prod" profile -> the same app, with the database path configurable.
#  Used by the Docker image so the H2 file lives on a mounted volume.
#  Set DB_PATH=/app/data/bank_system (or any absolute path) on the host.
# =====================================================================
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/bank_system};MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The schema ships inside the jar (db/bank_system_h2.sql) and is created once.
# continue-on-error keeps it re-runnable: existing rows are never touched.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/bank_system_h2.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# See application-local.properties for why validation is off on the H2 path.
spring.jpa.hibernate.ddl-auto=none

# Behind a reverse proxy (Render / Fly / Railway) the session cookie must stay
# first-party and the forwarded headers must be honoured.
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax

# Health endpoint used by the platform's health check.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
